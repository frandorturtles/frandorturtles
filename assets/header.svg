<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4efdd"/>
      <stop offset="1" stop-color="#bdd8b8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9fc09a" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <path id="spark" d="M0-10 C1-3 3-1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3-1 -1-3 0-10Z"/>
  </defs>
  <style>
    .title{font:700 64px Georgia,'Times New Roman',serif;fill:#3f6b4a;letter-spacing:2px}
    .title2{font:700 64px Georgia,'Times New Roman',serif;fill:#f4a6c0;letter-spacing:2px}
    .hey{font:italic 22px Georgia,serif;fill:#5a8a64}
    .sub{font:600 20px 'Courier New',monospace;fill:#3f6b4a}
    .tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .tw2{animation-delay:.8s}.tw3{animation-delay:1.6s}.tw4{animation-delay:2.2s}
    @keyframes tw{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
    .float{animation:fl 5s ease-in-out infinite}
    .float2{animation:fl 6.5s ease-in-out infinite reverse}
    @keyframes fl{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
    .l1{animation:cyc 12s infinite;opacity:0}
    .l2{animation:cyc 12s infinite 4s;opacity:0}
    .l3{animation:cyc 12s infinite 8s;opacity:0}
    @keyframes cyc{0%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-8px)}}
    .cursor{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
  </style>

  <rect width="900" height="300" rx="22" fill="url(#bg)"/>
  <rect width="900" height="300" rx="22" fill="url(#grid)"/>

  <!-- washi tape -->
  <g opacity="0.9">
    <rect x="-20" y="22" width="150" height="34" fill="#f7b8cf" transform="rotate(-35 55 40)"/>
    <rect x="780" y="236" width="150" height="34" fill="#f7b8cf" transform="rotate(-35 855 253)"/>
    <rect x="770" y="18" width="130" height="30" fill="#fbe3a8" transform="rotate(30 835 33)"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6c9">
    <use href="#spark" x="150" y="90" class="tw"/>
    <use href="#spark" x="760" y="110" class="tw tw2"/>
    <use href="#spark" x="620" y="60" class="tw tw3" transform="scale(.8)"/>
    <use href="#spark" x="90" y="235" class="tw tw4"/>
    <use href="#spark" x="700" y="250" class="tw tw2"/>
  </g>
  <g fill="#f4a6c0">
    <circle cx="240" cy="45" r="4" class="tw tw3"/>
    <circle cx="840" cy="170" r="5" class="tw"/>
    <circle cx="50" cy="150" r="4" class="tw tw2"/>
  </g>

  <!-- flower floating -->
  <g class="float" transform="translate(805 175)">
    <g fill="#f4a6c0">
      <circle cx="0" cy="-16" r="11"/><circle cx="15" cy="-5" r="11"/><circle cx="9" cy="13" r="11"/>
      <circle cx="-9" cy="13" r="11"/><circle cx="-15" cy="-5" r="11"/>
    </g>
    <circle r="9" fill="#ffe28a"/>
  </g>
  <g class="float2" transform="translate(95 90)">
    <g fill="#ffffff">
      <circle cx="0" cy="-10" r="7"/><circle cx="10" cy="-3" r="7"/><circle cx="6" cy="9" r="7"/>
      <circle cx="-6" cy="9" r="7"/><circle cx="-10" cy="-3" r="7"/>
    </g>
    <circle r="6" fill="#f4c64a"/>
  </g>

  <!-- text -->
  <text x="450" y="95" text-anchor="middle" class="hey">hola, soy</text>
  <text x="450" y="165" text-anchor="middle" class="title">FRANCESCA<tspan class="title2">.</tspan></text>

  <g text-anchor="middle">
    <text x="450" y="215" class="sub l1">estudiante de ingeniería electrónica</text>
    <text x="450" y="215" class="sub l2">organizadora STEM &amp; tech leader</text>
    <text x="450" y="215" class="sub l3">construyendo cosas entre código y hardware</text>
  </g>
  <text x="450" y="252" text-anchor="middle" class="hey" style="font-size:17px">Uninorte  ·  Barranquilla, Colombia<tspan class="cursor"> |</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
